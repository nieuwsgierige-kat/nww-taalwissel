name: Koppellijst bijwerken

on:
  schedule:
    - cron: "17 4 * * 1"   # maandag 04:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Alle pagina's opnieuw ophalen (niet alleen gewijzigde)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-map
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Koppellijst bouwen
        env:
          FULL: ${{ inputs.full && '1' || '0' }}
        run: python build_map.py
      - name: Opslaan in repo (voor de volgende, incrementele run)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/map.json data/state.json
          git diff --cached --quiet || git commit -m "Koppellijst bijgewerkt"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
